<!-- page-sync: thank-you.html -->

<!-- Google Fonts: Manrope -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     DESIGN SYSTEM & TOKENS (Sites by Sara Design System)
     ============================================================ */
  :root {
    /* Vertical padding of every full-width section (top and bottom): one value so the gap between sections is identical across the site. */
    --section-gap: clamp(32px, 4vw, 50px);
    --brand-blue: #3A539B;
    --brand-blue-hover: #2F437D;
    --brand-blue-tint: #EEF2FA;

    --brand-coral: #ea4e5f;

    --brand-gradient: linear-gradient(135deg, #0250c5 0%, #d43f8d 100%);
    --brand-gradient-hover: linear-gradient(135deg, #0243a4 0%, #c0337d 100%);

    --navy: #1E2140;
    --slate: #5F6368;
    --slate-light: #80868B;

    --border-light: #ECEFF5;
    --border-card: #DFE4EE;

    --bg-white: #FFFFFF;
    --bg-light: #F9FAFD;

    --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    --radius-sm: 8px;
    --radius-lg: 24px;
    --radius-pill: 9999px;

    --shadow-floating: 0 14px 36px -4px rgba(30, 33, 64, 0.12), 0 2px 8px rgba(30, 33, 64, 0.04);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: var(--font);
    color: var(--navy);
    background-color: var(--bg-white);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ============================================================
     PAGE TITLE BANNER
     ============================================================ */
  .page-title-banner {
    position: relative;
    overflow: hidden;
    background: var(--brand-gradient);
    padding: clamp(52px, 6vw, 76px) 24px;
    text-align: center;
    color: #FFFFFF;
    box-shadow: 0 6px 28px rgba(2, 80, 197, 0.18);
  }

  .page-title-banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 14% 20%, rgba(255, 255, 255, 0.2) 0%, transparent 40%),
      radial-gradient(circle at 86% 80%, rgba(212, 63, 141, 0.32) 0%, transparent 50%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.08) 100%);
    pointer-events: none;
  }

  .page-title-banner-mesh {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .page-title-banner-mesh::before,
  .page-title-banner-mesh::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(55px);
    opacity: 0.22;
  }

  .page-title-banner-mesh::before {
    width: 320px;
    height: 320px;
    background: #FFFFFF;
    top: -120px;
    left: 8%;
  }

  .page-title-banner-mesh::after {
    width: 280px;
    height: 280px;
    background: var(--brand-coral);
    bottom: -80px;
    right: 10%;
  }

  .page-title-inner {
    position: relative;
    z-index: 2;
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page-banner-h1 {
    font-size: clamp(1.85rem, 1.5rem + 1.2vw, 2.6rem);
    font-weight: 700;
    line-height: 1.2;
    color: #FFFFFF;
    letter-spacing: -0.025em;
    margin: 0;
    text-shadow: 0 2px 16px rgba(2, 40, 100, 0.3);
  }

  /* ============================================================
     THANK YOU MESSAGE
     ============================================================ */
  .thanks-section {
    padding: clamp(48px, 7vw, 96px) 0;
    background: var(--bg-light);
  }

  .thanks-card {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(40px, 5vw, 60px) clamp(24px, 5vw, 56px) clamp(36px, 4.5vw, 52px);
    text-align: center;
    background: var(--bg-white);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-floating);
    overflow: hidden;
  }

  /* gradient edge along the top of the card */
  .thanks-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: var(--brand-gradient);
  }

  .thanks-badge {
    position: relative;
    width: 88px;
    height: 88px;
    margin: 0 auto 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #FFFFFF;
    background: var(--brand-gradient);
    box-shadow: 0 10px 26px rgba(2, 80, 197, 0.28);
    animation: thanks-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* soft ring that fades out around the badge */
  .thanks-badge::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid var(--brand-coral);
    opacity: 0;
    animation: thanks-ring 1.4s ease-out 0.5s 1 both;
  }

  .thanks-badge svg {
    width: 42px;
    height: 42px;
  }

  .thanks-check {
    stroke-dasharray: 26;
    stroke-dashoffset: 26;
    animation: thanks-draw 0.45s ease-out 0.4s forwards;
  }

  .thanks-title {
    margin: 0 0 12px;
    font-size: clamp(1.4rem, 1.15rem + 0.9vw, 1.85rem);
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.02em;
    color: var(--navy);
  }

  .thanks-text {
    max-width: 460px;
    margin: 0 auto 30px;
    font-size: 1.02rem;
    line-height: 1.7;
    color: var(--slate);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--font);
    font-size: 0.98rem;
    font-weight: 700;
    padding: 13px 28px;
    border-radius: var(--radius-pill);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--brand-gradient);
    background-clip: padding-box;
    color: #FFFFFF;
    box-shadow: 0 4px 16px rgba(2, 80, 197, 0.28);
  }

  .btn-primary:hover,
  .btn-primary:focus,
  .btn-primary:focus-visible,
  .btn-primary:active {
    background: var(--brand-gradient-hover);
    background-clip: padding-box;
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(212, 63, 141, 0.35);
    color: #FFFFFF !important;
  }

  .btn:focus-visible {
    outline: 3px solid var(--brand-blue);
    outline-offset: 3px;
  }

  @keyframes thanks-pop {
    from {
      transform: scale(0.5);
      opacity: 0;
    }

    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  @keyframes thanks-draw {
    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes thanks-ring {
    0% {
      transform: scale(1);
      opacity: 0.55;
    }

    100% {
      transform: scale(1.55);
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {

    .thanks-badge,
    .thanks-badge::after,
    .thanks-check {
      animation: none;
    }

    .thanks-check {
      stroke-dashoffset: 0;
    }
  }

  @media (max-width: 600px) {
    .page-title-banner {
      padding: 44px 18px;
    }
  }
</style>

<!-- ============================================================
       PAGE TITLE BANNER
       ============================================================ -->
<section class="page-title-banner" aria-label="Page Title">
  <div class="page-title-banner-mesh" aria-hidden="true"></div>
  <div class="container page-title-inner">
    <h1 class="page-banner-h1">Thank You</h1>
  </div>
</section>

<!-- ============================================================
       THANK YOU MESSAGE
       ============================================================ -->
<section class="thanks-section" aria-label="Form submitted">
  <div class="container">
    <div class="thanks-card" role="status">
      <div class="thanks-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
          stroke-linejoin="round" focusable="false">
          <path class="thanks-check" d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
      </div>
      <h2 class="thanks-title">Your form has been submitted</h2>
      <p class="thanks-text">Thank you for filling out the form. We&rsquo;ve received your details and will be in
        touch with you soon.</p>
      <a href="/" class="btn btn-primary">Back to Home</a>
    </div>
  </div>
</section>
