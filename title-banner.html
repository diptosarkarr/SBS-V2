<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title Banner</title>

  <!-- Google Fonts: Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
     DESIGN SYSTEM & TOKENS (Sites by Sara Design System)
     ============================================================ */
    :root {
      /* Brand Identity Palette */
      --brand-blue: #3A539B;
      --brand-blue-hover: #2F437D;
      --brand-blue-tint: #EEF2FA;
      --brand-blue-subtle: #F6F8FD;

      --brand-coral: #ea4e5f;
      --brand-coral-hover: #d43d4e;
      --brand-coral-tint: #FDEEEE;

      --brand-peach: #FCEFE5;
      --brand-peach-hover: #F8E3D4;
      --brand-peach-tint: #FFF9F5;

      --brand-gradient: linear-gradient(135deg, #0250c5 0%, #d43f8d 100%);
      --brand-gradient-hover: linear-gradient(135deg, #0243a4 0%, #c0337d 100%);

      /* Neutrals & Text Hierarchy */
      --navy: #1E2140;
      --navy-dark: #13152C;
      --slate: #5F6368;
      --slate-light: #80868B;
      --slate-subtle: #9AA0A6;

      /* Surfaces & Borders */
      --border: #DCE2EE;
      --border-light: #ECEFF5;
      --border-card: #DFE4EE;

      --bg-white: #FFFFFF;
      --bg-light: #F9FAFD;
      --bg-banner: #FCEFE5;
      --bg-callout: #FFFBF7;

      /* Status Accents */
      --green: #1E8E3E;
      --green-tint: #E6F4EA;
      --yellow: #FBBC04;
      --yellow-tint: #FEF7E0;

      /* Typography */
      --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Radii */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-pill: 9999px;

      /* Shadows */
      --shadow-subtle: 0 1px 3px rgba(30, 33, 64, 0.06), 0 4px 10px rgba(30, 33, 64, 0.04);
      --shadow-card: 0 1px 3px rgba(30, 33, 64, 0.08), 0 4px 14px rgba(30, 33, 64, 0.05);
      --shadow-card-hover: 0 12px 28px -6px rgba(30, 33, 64, 0.12), 0 4px 12px rgba(30, 33, 64, 0.06);
      --shadow-floating: 0 14px 36px -4px rgba(30, 33, 64, 0.12), 0 2px 8px rgba(30, 33, 64, 0.04);
      --shadow-featured: 0 16px 40px -8px rgba(58, 83, 155, 0.22), 0 4px 14px rgba(30, 33, 64, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      color: var(--navy);
      background-color: var(--bg-white);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ============================================================
     PAGE TITLE BANNER (Full-Width Brand Gradient)
     ============================================================ */
    .page-title-banner {
      position: relative;
      overflow: hidden;
      background: var(--brand-gradient);
      padding: clamp(52px, 6vw, 76px) 24px;
      text-align: center;
      color: #FFFFFF;
      box-shadow: 0 6px 28px rgba(2, 80, 197, 0.18);
    }

    .page-title-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 14% 20%, rgba(255, 255, 255, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 86% 80%, rgba(212, 63, 141, 0.32) 0%, transparent 50%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.08) 100%);
      pointer-events: none;
    }

    .page-title-banner-mesh {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .page-title-banner-mesh::before,
    .page-title-banner-mesh::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.22;
    }

    .page-title-banner-mesh::before {
      width: 320px;
      height: 320px;
      background: #FFFFFF;
      top: -120px;
      left: 8%;
    }

    .page-title-banner-mesh::after {
      width: 280px;
      height: 280px;
      background: var(--brand-coral);
      bottom: -80px;
      right: 10%;
    }

    .page-title-inner {
      position: relative;
      z-index: 2;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-banner-h1 {
      font-size: clamp(1.85rem, 1.5rem + 1.2vw, 2.6rem);
      font-weight: 700;
      line-height: 1.2;
      color: #FFFFFF;
      letter-spacing: -0.025em;
      margin: 0 0 10px;
      text-shadow: 0 2px 16px rgba(2, 40, 100, 0.3);
    }

    .page-banner-sub {
      font-size: clamp(1.15rem, 2.2vw, 1.45rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.94);
      letter-spacing: 0.01em;
      margin: 0;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.18);
    }

    /* ============================================================
     RESPONSIVE BREAKPOINTS
     ============================================================ */
    @media (max-width: 600px) {
      .page-title-banner {
        padding: 44px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- ============================================================
       PAGE TITLE BANNER (POLISHED FULL-WIDTH GRADIENT)
       ============================================================ -->
  <section class="page-title-banner" aria-label="Page Title">
    <div class="page-title-banner-mesh" aria-hidden="true"></div>
    <div class="container page-title-inner">
      <h1 class="page-banner-h1">Custom Web Development Services</h1>
      <p class="page-banner-sub">(Tailored WordPress Solutions for Ambitious Brands)</p>
    </div>
  </section>

</body>

</html>
